# Builds the Android live wallpaper app (android/) with the game's wallpaper page inside it.
# Every build on main is published as a GitHub release, so the newest APK is always at
# https://github.com/GRIMDROWNED/Drowned-Light-Wallpaper-Game/releases/latest/download/drowned-light-wallpaper.apk
name: Android wallpaper app
on:
  push:
    branches: [main, "claude/**"]
    paths: ["android/**", "src/**", "assets/**", "wallpaper.html", "style.css", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Build the APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk drowned-light-wallpaper.apk
      - uses: actions/upload-artifact@v4
        with: { name: drowned-light-wallpaper, path: drowned-light-wallpaper.apk }
      - name: Publish as the latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Android wallpaper app ${{ github.run_number }}
          body: "Install on Android: download drowned-light-wallpaper.apk, open it, allow installing from your browser, then open Drowned Light and tap Set wallpaper. From now on the app updates itself: each time you open the game it checks here and offers the new version."
          files: drowned-light-wallpaper.apk
          make_latest: "true"
